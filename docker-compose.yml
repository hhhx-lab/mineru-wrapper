services:
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: mineru-wrapper-redis
    network_mode: host
    command:
      - redis-server
      - --bind
      - 127.0.0.1
      - --protected-mode
      - "yes"
      - --appendonly
      - "yes"
      - --dir
      - /data
    volumes:
      - ./data/redis:/data
    restart: unless-stopped

  api:
    build: .
    container_name: mineru-wrapper-api
    network_mode: host
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - redis

  worker:
    build: .
    container_name: mineru-wrapper-worker
    network_mode: host
    env_file:
      - .env
    command: celery -A app.tasks:celery_app worker --loglevel=INFO --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - redis
